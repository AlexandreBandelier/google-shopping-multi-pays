name: Generation et Export du Flux sur Google Drive

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests dict2xml google-api-python-client google-auth

    - name: Run Feed Processor Script
      env:
        WOO_URL: ${{ secrets.WOO_URL }}
        WOO_KEY: ${{ secrets.WOO_KEY }}
        WOO_SECRET: ${{ secrets.WOO_SECRET }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      run: python main.py
